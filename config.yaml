# Configuração do Sócrates
# NÃO edite este arquivo para as suas preferências: crie um "config.local.yaml" ao lado
# só com o que quer mudar (ex.: a voz). Ele vale por cima deste e não trava o git pull.

nome: Sócrates
modo_inicial: explicar        # explicar | testar
historico_max: 12             # quantas mensagens ele lembra na conversa atual
local: Morrinhos, Goiás       # usado para clima e perguntas sobre "aqui"

# Onde o Sócrates PENSA:
#   nuvem: rodízio grátis (Groq, Mistral, Gemini); mais inteligente, precisa de internet
#   local: no seu computador, com o Ollama; sem limite e sem chave (configure com main.py --local)
# A voz (Edge) e o ouvido (Whisper no Groq) continuam iguais nos dois modos.
cerebro: nuvem

local:                        # usado quando cerebro: local
  modelo: qwen3.5:4b          # 2b se o PC tiver pouca memória; o --local escolhe sozinho
  url: http://localhost:11434
  contexto: 6144              # memória da conversa (mais = mais RAM)
  pesquisa: true              # pesquisa no DuckDuckGo (sem chave); o resumo é feito no PC

acoes:
  ativas: true                # abrir programas e sites, volume, timer, anotações
  programas:                  # programas extras: nome falado: caminho do .exe
    # anki: 'C:\Program Files\Anki\anki.exe'
    # obsidian: '%LOCALAPPDATA%\Programs\Obsidian\Obsidian.exe'

claude:                       # "Sócrates, pede pro Claude..." digita no app do Claude
  enviar_com_enter: true      # false = só cola a mensagem, você confere e aperta Enter

visao:                        # ver a tela (só quando você pede); tenta na ordem
  modelo: qwen/qwen3.8-27b      # no Groq
  reservas:                     # provedor: modelo (pulado se não tiver chave)
    mistral: mistral-medium-latest
    gemini: gemini-flash-latest

pesquisa:
  ativa: true                 # pesquisa na internet quando a pergunta é sobre algo atual
                              # (só no Groq com modelo gpt-oss)

llm:
  temperatura: 0.6
  # Rodízio de cérebros GRÁTIS: tenta na ordem; se um bater no limite, vai para o próximo.
  # Provedor sem chave no .env é pulado (dá para criar as contas aos poucos).
  rodizio: [groq, mistral, gemini, groq_leve]
  rodizio_acoes: [groq_leve, mistral_leve, gemini, groq]   # quem mexe no PC

provedores:
  groq:                         # rápido; tem pesquisa na internet e visão
    base_url: https://api.groq.com/openai/v1
    chave_env: GROQ_API_KEY
    modelo: openai/gpt-oss-120b
  groq_leve:                    # outro modelo = outro limite grátis
    base_url: https://api.groq.com/openai/v1
    chave_env: GROQ_API_KEY
    modelo: openai/gpt-oss-20b
  mistral:                      # ~1 bilhão de tokens/mês grátis (console.mistral.ai)
    base_url: https://api.mistral.ai/v1
    chave_env: MISTRAL_API_KEY
    modelo: mistral-medium-latest
  mistral_leve:
    base_url: https://api.mistral.ai/v1
    chave_env: MISTRAL_API_KEY
    modelo: mistral-small-latest
  gemini:                       # grátis com a conta Google (aistudio.google.com/apikey)
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    chave_env: GEMINI_API_KEY
    modelo: gemini-flash-latest
  ollama:                       # roda no seu PC, sem internet; lento sem placa de vídeo
    base_url: http://localhost:11434/v1
    chave_env: null
    modelo: qwen2.5:3b

voz:                          # rode "main.py --vozes" para ouvir as opções e escolher
  ativa: true                 # false = só texto (igual à fase 0)
  provedor: edge              # edge (grátis, sem chave) | gemini (mais natural, GEMINI_API_KEY)
  nome: pt-BR-AntonioNeural   # voz do Edge
  velocidade: "+5%"           # mais rápido: "+15%" | mais devagar: "-10%"
  tom: "+0Hz"                 # mais grave: "-8Hz"
  gemini_voz: Sadaltager      # voz do Gemini: Sadaltager, Charon, Gacrux, Algenib, Iapetus...
  gemini_modelo: gemini-3.8-flash-tts
  saudacao: true              # fala "olá" ao ligar (serve de teste do som)

escuta:                       # mãos livres: ele fica ouvindo o tempo todo
  palavra_ativacao: true      # true = só responde quando você diz "Sócrates"
                              # false = responde a tudo que ouvir (estudando sozinho no quarto)
  janela_seg: 15              # depois da resposta, quanto tempo você pode falar sem dizer o nome
  janela_prova_seg: 45        # no modo prova é maior: tempo para pensar na resposta

visor:
  ativo: true                 # janela laranja estilo Jarvis
  sempre_no_topo: false       # true = fica por cima das outras janelas
  escala: 1.25                # tamanho do visor: 1.0 pequeno, 1.25 médio, 1.5 grande
  cor: laranja                # laranja, azul, ciano, verde, roxo, rosa, vermelho, branco
                              # (ou diga "Sócrates, muda a cor do visor para azul")

planilha:                     # a mesma planilha do app estudo-prf (opcional)
  url: ""                     # a URL do Apps Script (termina em /exec); ponha no config.local.yaml
  chave_env: PLANILHA_CHAVE   # a chave fica no .env

ouvido:                       # transcrição (Whisper no Groq, grátis)
  base_url: https://api.groq.com/openai/v1
  chave_env: GROQ_API_KEY
  modelo: whisper-large-v3-turbo

microfone:
  silencio_seg: 1.2           # quanto silêncio encerra sua fala
  max_seg: 30                 # fala mais longa permitida
  espera_seg: 8               # quanto espera você começar a falar
  sensibilidade: 3.0          # se ele não te ouve, diminua (2.0); se dispara à toa, aumente (4.0)
  dispositivo: null           # null = microfone padrão do Windows

log:
  nivel: INFO                 # DEBUG mostra tudo
  arquivo: socrates.log
