# Configuração do Sócrates
# Troque o provedor do cérebro mudando só a linha "provedor".

nome: Sócrates
modo_inicial: explicar        # explicar | testar
historico_max: 20             # quantas mensagens ele lembra na conversa atual
local: Morrinhos, Goiás       # usado para clima e perguntas sobre "aqui"

pesquisa:
  ativa: true                 # pesquisa na internet quando a pergunta é sobre algo atual
                              # (só no Groq com modelo gpt-oss)

llm:
  provedor: groq              # groq | gemini | ollama
  temperatura: 0.6

provedores:
  groq:
    base_url: https://api.groq.com/openai/v1
    chave_env: GROQ_API_KEY
    modelo: openai/gpt-oss-120b
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    chave_env: GEMINI_API_KEY
    modelo: gemini-flash-latest
  ollama:                     # roda local; lento sem placa de vídeo
    base_url: http://localhost:11434/v1
    chave_env: null
    modelo: qwen2.5:3b

voz:
  ativa: true                 # false = só texto (igual à fase 0)
  nome: pt-BR-AntonioNeural   # outras: pt-BR-FranciscaNeural, pt-BR-ThalitaNeural
  velocidade: "+5%"           # mais rápido: "+15%" | mais devagar: "-10%"
  saudacao: true              # fala "olá" ao ligar (serve de teste do som)

escuta:                       # mãos livres: ele fica ouvindo o tempo todo
  palavra_ativacao: true      # true = só responde quando você diz "Sócrates"
                              # false = responde a tudo que ouvir (estudando sozinho no quarto)
  janela_seg: 15              # depois da resposta, quanto tempo você pode falar sem dizer o nome
  janela_prova_seg: 45        # no modo prova é maior: tempo para pensar na resposta

visor:
  ativo: true                 # janela laranja estilo Jarvis
  sempre_no_topo: false       # true = fica por cima das outras janelas

ouvido:                       # transcrição (Whisper no Groq, grátis)
  base_url: https://api.groq.com/openai/v1
  chave_env: GROQ_API_KEY
  modelo: whisper-large-v3-turbo

microfone:
  silencio_seg: 1.2           # quanto silêncio encerra sua fala
  max_seg: 30                 # fala mais longa permitida
  espera_seg: 8               # quanto espera você começar a falar
  sensibilidade: 3.0          # se ele não te ouve, diminua (2.0); se dispara à toa, aumente (4.0)
  dispositivo: null           # null = microfone padrão do Windows

log:
  nivel: INFO                 # DEBUG mostra tudo
  arquivo: socrates.log
